aid: figure-robotics
name: Figure
description: >-
  Figure is a Sunnyvale, California humanoid robotics company building
  general-purpose bipedal robots for the home and the workplace. Its current
  flagship product is Figure 03, marketed as an everyday general-purpose
  humanoid robot, succeeding Figure 01 and Figure 02. Figure develops Helix,
  an in-house Vision-Language-Action (VLA) model that unifies perception,
  language understanding, and learned control to drive a full upper humanoid
  body at 35 degrees of freedom and 200 Hz, with capabilities including
  novel-object manipulation from natural-language commands and multi-robot
  task coordination. Figure has run commercial pilots with partners such as
  BMW and previously collaborated with OpenAI on language models. The
  company's revenue model is robot sales/leasing and enterprise deployments;
  Helix is a proprietary on-board model and there is no public developer
  API, SDK, or open-source release for Figure or Helix.
